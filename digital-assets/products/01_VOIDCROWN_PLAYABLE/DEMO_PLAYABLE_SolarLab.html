<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Solar Smash Risk Lab v1.3 — Activo Digital</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050510;color:#e8f0ff;font-family:system-ui,sans-serif;overflow:hidden;height:100vh}
#ui{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:linear-gradient(#0a0a20ee,#0000)}
button,select{background:#1a2050;color:#cde;border:1px solid #456;border-radius:8px;padding:8px 12px;min-height:44px;cursor:pointer;font-size:13px}
button:hover{background:#2a3080}
#stats{position:fixed;bottom:0;left:0;right:0;padding:8px 12px;background:#000a;font-size:12px;z-index:5}
#log{position:fixed;right:8px;top:56px;width:min(280px,40vw);max-height:40vh;overflow:auto;background:#0008;padding:8px;border-radius:8px;font-size:11px;z-index:5}
canvas{display:block;width:100vw;height:100vh}
</style></head><body>
<div id="ui">
<button id="btnForm">Formar sistema</button>
<button id="btnGod">God Mode</button>
<button id="btnClear">Limpiar</button>
<button id="btnExport">Export JSON</button>
<select id="mode"><option value="drag">Arrastrar impulso</option><option value="spawn">Crear planeta</option></select>
</div>
<div id="log"></div>
<div id="stats">Solar Smash Risk Lab v1.3 · Activo digital</div>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H,cam={x:0,y:0,z:1},bodies=[],particles=[],god=false,drag=null;
const G=0.08, logEl=document.getElementById('log');
function log(m){const d=document.createElement('div');d.textContent=m;logEl.prepend(d);while(logEl.children.length>40)logEl.lastChild.remove()}
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}resize();addEventListener('resize',resize);
function Body(x,y,r,mass,col,type='planet'){return{x,y,vx:0,vy:0,r,mass,col,type,trail:[]}}
function spawnSystem(){bodies=[];particles=[];bodies.push(Body(0,0,28,2200,'#ffcc44','star'));
const cols=['#6af','#f86','#8f6','#fa6','#a8f','#8cf'];
for(let i=0;i<6;i++){const a=i*1.1,d=120+i*55,m=20+i*12,r=6+i*2;const b=Body(Math.cos(a)*d,Math.sin(a)*d,r,m,cols[i%cols.length]);const v=Math.sqrt(G*2200/d)*0.92;b.vx=-Math.sin(a)*v;b.vy=Math.cos(a)*v;bodies.push(b)}
log('Sistema: 1 estrella + 6 planetas')}
function spawnAt(wx,wy){const r=5+Math.random()*8,m=r*r*0.4;bodies.push(Body(wx,wy,r,m,`hsl(${Math.random()*360},70%,65%)`));log('Spawn')}
function worldFrom(sx,sy){return{x:(sx-W/2)/cam.z+cam.x,y:(sy-H/2)/cam.z+cam.y}}
canvas.addEventListener('pointerdown',e=>{const w=worldFrom(e.clientX,e.clientY);if(document.getElementById('mode').value==='spawn'){spawnAt(w.x,w.y);return}
let best=null,bd=1e9;for(const b of bodies){const d=Math.hypot(b.x-w.x,b.y-w.y);if(d<b.r+15/cam.z&&d<bd){bd=d;best=b}}if(best)drag={b:best,x:w.x,y:w.y}});
canvas.addEventListener('pointermove',e=>{if(!drag)return;const w=worldFrom(e.clientX,e.clientY);drag.x=w.x;drag.y=w.y});
canvas.addEventListener('pointerup',()=>{if(!drag)return;const mult=god?8:1;drag.b.vx+=(drag.x-drag.b.x)*0.02*mult;drag.b.vy+=(drag.y-drag.b.y)*0.02*mult;log('Impulso'+(god?' GOD':''));drag=null});
canvas.addEventListener('wheel',e=>{cam.z=Math.min(3,Math.max(0.2,cam.z*(e.deltaY>0?0.9:1.1)))},{passive:true});
document.getElementById('btnForm').onclick=spawnSystem;document.getElementById('btnGod').onclick=()=>{god=!god;log('God '+(god?'ON':'OFF'))};
document.getElementById('btnClear').onclick=()=>{bodies=[];particles=[];log('Clear')};
document.getElementById('btnExport').onclick=()=>{const data=JSON.stringify({bodies:bodies.map(b=>({x:b.x,y:b.y,vx:b.vx,vy:b.vy,r:b.r,mass:b.mass,type:b.type}))});const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download='solar_lab.json';a.click()};
function step(){for(let i=0;i<bodies.length;i++)for(let j=i+1;j<bodies.length;j++){const a=bodies[i],b=bodies[j];let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)+0.5;const f=G*a.mass*b.mass/(d*d),fx=f*dx/d,fy=f*dy/d;a.vx+=fx/a.mass;a.vy+=fy/a.mass;b.vx-=fx/b.mass;b.vy-=fy/b.mass;
if(d<a.r+b.r){const nx=dx/d,ny=dy/d,ov=a.r+b.r-d;a.x-=nx*ov*0.5;a.y-=ny*ov*0.5;b.x+=nx*ov*0.5;b.y+=ny*ov*0.5;const vn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(vn<0){const j=-vn*0.6/(1/a.mass+1/b.mass);a.vx-=j*nx/a.mass;a.vy-=j*ny/a.mass;b.vx+=j*nx/b.mass;b.vy+=j*ny/b.mass;if(Math.abs(vn)>2)for(let k=0;k<8;k++)particles.push({x:(a.x+b.x)/2,y:(a.y+b.y)/2,vx:(Math.random()-0.5)*3,vy:(Math.random()-0.5)*3,life:40,col:'#fc8'});if(god&&Math.abs(vn)>6){const big=a.mass>b.mass?a:b;for(let k=0;k<20;k++){const ang=k/20*Math.PI*2,rr=big.r*1.8;particles.push({x:big.x+Math.cos(ang)*rr,y:big.y+Math.sin(ang)*rr,vx:-Math.sin(ang),vy:Math.cos(ang),life:100,col:'#aad'})}log('Anillos')}}}}
for(const b of bodies){b.x+=b.vx;b.y+=b.vy;b.trail.push({x:b.x,y:b.y});if(b.trail.length>40)b.trail.shift()}particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.life--;return p.life>0})}
function draw(){ctx.fillStyle='#050510';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(W/2,H/2);ctx.scale(cam.z,cam.z);ctx.translate(-cam.x,-cam.y);
ctx.fillStyle='#fff';for(let i=0;i<80;i++)ctx.fillRect(((i*97)%800)-400,((i*53)%600)-300,1,1);
for(const b of bodies){if(b.trail.length>1){ctx.beginPath();ctx.strokeStyle=b.col+'44';ctx.lineWidth=1/cam.z;ctx.moveTo(b.trail[0].x,b.trail[0].y);for(const t of b.trail)ctx.lineTo(t.x,t.y);ctx.stroke()}
const g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r*2.2);g.addColorStop(0,b.col);g.addColorStop(1,'#0000');ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,b.r*2.2,0,6.28);ctx.fill();ctx.fillStyle=b.col;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.28);ctx.fill()}
for(const p of particles){ctx.globalAlpha=Math.min(1,p.life/40);ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y,2/cam.z,2/cam.z);ctx.globalAlpha=1}
if(drag){ctx.strokeStyle='#8f8';ctx.beginPath();ctx.moveTo(drag.b.x,drag.b.y);ctx.lineTo(drag.x,drag.y);ctx.stroke()}ctx.restore();
document.getElementById('stats').textContent=`Cuerpos ${bodies.length} · Partículas ${particles.length} · Zoom ${cam.z.toFixed(2)} · God ${god?'ON':'OFF'} · Solar Lab v1.3`}
function loop(){step();draw();requestAnimationFrame(loop)}spawnSystem();loop();
</script></body></html>
